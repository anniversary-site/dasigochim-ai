  아래는 직전에 작성했던 초안과, 제보자가 남긴 수정 코멘트입니다.
  수정 코멘트를 반영해 초안 **전체**를 다시 작성합니다.
  코멘트가 언급하지 않은 항목은 직전 초안의 내용과 취지를 유지하되, 위 작성 규칙은 그대로 지킵니다.
